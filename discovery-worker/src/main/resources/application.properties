spring.application.name=discovery-worker
spring.main.web-application-type=none

# Database — master passes these via env vars; worker never touches schema
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/business_discovery}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Hikari pool (small — worker is short-lived)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.shutdown-timeout=2000

# LLM provider selection
worker.llm.provider=${LLM_PROVIDER:claude}
worker.llm.anthropic.api-key=${ANTHROPIC_API_KEY:}
worker.llm.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}
worker.llm.gemini.api-key=${GEMINI_API_KEY:}
worker.llm.gemini.model=${GEMINI_MODEL:gemini-2.5-pro-preview-03-25}

# GitHub integration
worker.github.token=${GITHUB_TOKEN:}
worker.github.repo-url=${GITHUB_REPO_URL:}
worker.github.branch=${GITHUB_BRANCH:main}
worker.github.owner=${GITHUB_OWNER:}

# Task identity (injected by master ContainerSpawnerNode)
worker.task.id=${TASK_ID:}
worker.task.brief-id=${BRIEF_ID:}
worker.task.business-id=${BUSINESS_ID:}
worker.task.attempt-number=${ATTEMPT_NUMBER:0}
worker.task.desc=${TASK_DESC:{}}

# Workspace directory inside the container
worker.workspace.dir=${WORKER_WORKSPACE_DIR:/workspace}

# Tavily web search (used by ErrorFixNode)
worker.tavily.api-key=${TAVILY_API_KEY:}

# Logging
logging.level.com.business.discovery.worker=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%logger{30}] - %msg%n
