spring.application.name=discovery-worker
spring.main.web-application-type=none

# Database — master passes these via env vars; worker never touches schema
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/business_discovery}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Hikari pool (small — worker is short-lived)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.shutdown-timeout=2000

# LLM configuration — three model beans, each wired to a specific node role
worker.llm.anthropic.api-key=${ANTHROPIC_API_KEY:}
worker.llm.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}
worker.llm.gemini.api-key=${GEMINI_API_KEY:}
worker.llm.gemini.pro-model=${GEMINI_PRO_MODEL:gemini-2.5-flash}
worker.llm.gemini.flash-model=${GEMINI_FLASH_MODEL:gemini-2.5-flash}
worker.llm.gemini.pro-max-tokens=${GEMINI_PRO_MAX_TOKENS:65536}
worker.llm.gemini.flash-max-tokens=${GEMINI_FLASH_MAX_TOKENS:16384}
worker.llm.gemini.pro-timeout-seconds=${GEMINI_PRO_TIMEOUT_SECONDS:300}
worker.llm.gemini.flash-timeout-seconds=${GEMINI_FLASH_TIMEOUT_SECONDS:90}
worker.llm.gemini.pro-thinking-budget=${GEMINI_PRO_THINKING_BUDGET:16384}
worker.llm.gemini.flash-thinking-budget=${GEMINI_FLASH_THINKING_BUDGET:0}

# GitHub integration
worker.github.token=${GITHUB_TOKEN:}
worker.github.repo-url=${GITHUB_REPO_URL:}
worker.github.branch=${GITHUB_BRANCH:main}
worker.github.owner=${GITHUB_OWNER:}

# Task identity (injected by master ContainerSpawnerNode)
worker.task.id=${TASK_ID:}
worker.task.brief-id=${BRIEF_ID:}
worker.task.business-id=${BUSINESS_ID:}
worker.task.attempt-number=${ATTEMPT_NUMBER:0}
worker.task.desc=${TASK_DESC:{}}

# Workspace directory inside the container
worker.workspace.dir=${WORKER_WORKSPACE_DIR:/workspace}

# LLM interaction journal — written to <workspace>/docs/llm/interactions.jsonl,
# force-pushed with failure commits for debugging failed generations
worker.llm.log.enabled=${WORKER_LLM_LOG_ENABLED:true}
worker.llm.log.max-chars=${WORKER_LLM_LOG_MAX_CHARS:20000}

# Smoke test + image publish (SmokeTestNode / ImagePublishNode)
# worker.docker.host: docker daemon the worker's docker CLI targets; blank = local socket (dev)
worker.docker.host=${WORKER_DOCKER_HOST:}
worker.docker.network=${DOCKER_NETWORK_NAME:shared-network}
worker.smoke.enabled=${WORKER_SMOKE_ENABLED:true}
worker.smoke.in-container=${WORKER_SMOKE_IN_CONTAINER:true}
worker.smoke.boot-timeout-seconds=${WORKER_SMOKE_BOOT_TIMEOUT_SECONDS:120}
worker.smoke.flows-strict=${WORKER_SMOKE_FLOWS_STRICT:false}

# Tavily web search (used by ErrorFixNode)
worker.tavily.api-key=${TAVILY_API_KEY:}

# Logging
logging.level.com.business.discovery.worker=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%logger{30}] - %msg%n
