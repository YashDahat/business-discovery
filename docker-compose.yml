services:
  postgres:
    image: postgres:16-alpine
    container_name: phase1-db
    environment:
      POSTGRES_DB: business_discovery
      POSTGRES_USER: amardahat
      POSTGRES_PASSWORD: 94227
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amardahat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shared-network

  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy
    hostname: docker-proxy        # ← explicitly set hostname
    privileged: true
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 0
      AUTH: 0
      POST: 1
      DELETE: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "2375:2375"
    networks:
      shared-network:
        aliases:
          - docker-proxy          # ← DNS alias on the network

  app:
    build: .
    container_name: phase1-app
    env_file:
      - .env
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    networks:
      - shared-network

volumes:
  pgdata:

networks:
  shared-network:
    name: shared-network
    driver: bridge