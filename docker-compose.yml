version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: phase1-db
    environment:
      POSTGRES_DB: business_discovery
      POSTGRES_USER: amardahat
      POSTGRES_PASSWORD: 94227
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - shared-network

  app:
    build: .
    container_name: phase1-app
    env_file:
      - .env
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      - postgres
    networks:
      - shared-network

volumes:
  pgdata:

networks:
  shared-network:
    name: shared-network