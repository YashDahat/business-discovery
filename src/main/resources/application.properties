# ??? Server ???????????????????????????????????????????????
server.port=${SERVER_PORT:8090}

# ??? Database ?????????????????????????????????????????????
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/business_discovery}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:600000}

# ??? JPA ??????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.type.json_format_mapper=jackson
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ??? Gemini ???????????????????????????????????????????????
langchain4j.google-ai-gemini.chat-model.api-key=${GEMINI_API_KEY}
langchain4j.google-ai-gemini.model-name=${GEMINI_MODEL:gemini-2.5-pro-preview-03-25}
langchain4j.google-ai-gemini.temperature=${GEMINI_TEMPERATURE:0.3}
langchain4j.google-ai-gemini.max-output-tokens=${GEMINI_MAX_TOKENS:8192}

# ??? Tavily ???????????????????????????????????????????????
tavily.api-key=${TAVILY_API_KEY}
tavily.max-results=${TAVILY_MAX_RESULTS:5}
tavily.include-answer=${TAVILY_INCLUDE_ANSWER:true}
tavily.include-raw-content=${TAVILY_INCLUDE_RAW_CONTENT:false}

# ??? Scraper ??????????????????????????????????????????????
scraper.base-url=${SCRAPER_BASE_URL:http://localhost:8080}
scraper.poll-interval-ms=${SCRAPER_POLL_INTERVAL_MS:20000}
scraper.default-depth=${SCRAPER_DEFAULT_DEPTH:5}

# ??? LangGraph4j ??????????????????????????????????????????
langgraph4j.postgres.host=${LANGGRAPH4J_DB_HOST:localhost}
langgraph4j.postgres.port=${LANGGRAPH4J_DB_PORT:5432}
langgraph4j.postgres.database=${LANGGRAPH4J_DB_DATABASE}
langgraph4j.postgres.username=${LANGGRAPH4J_DB_USERNAME}
langgraph4j.postgres.password=${LANGGRAPH4J_DB_PASSWORD}

# ??? Agent ????????????????????????????????????????????????
agent.scoring.min-review-count=${AGENT_MIN_REVIEW_COUNT:200}
agent.scoring.min-rating=${AGENT_MIN_RATING:4.0}
agent.scoring.tier1-review-count=${AGENT_TIER1_REVIEW_COUNT:500}
agent.scoring.tier1-min-rating=${AGENT_TIER1_MIN_RATING:4.0}
agent.scoring.tier2-review-count=${AGENT_TIER2_REVIEW_COUNT:200}
agent.scoring.tier2-min-rating=${AGENT_TIER2_MIN_RATING:3.8}

# ??? Logging ??????????????????????????????????????????????
logging.level.com.business.discovery=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{runId}] %logger{36} - %msg%n