# ??? Server ???????????????????????????????????????????????
server.port=${SERVER_PORT:8090}

# ??? Database ?????????????????????????????????????????????
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/business_discovery}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:600000}

# ??? JPA ??????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.type.json_format_mapper=jackson
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ??? Gemini ???????????????????????????????????????????????
langchain4j.google-ai-gemini.chat-model.api-key=${GEMINI_API_KEY}
langchain4j.google-ai-gemini.model-name=${GEMINI_MODEL:gemini-2.5-pro-preview-03-25}
langchain4j.google-ai-gemini.temperature=${GEMINI_TEMPERATURE:0.3}
langchain4j.google-ai-gemini.max-output-tokens=${GEMINI_MAX_TOKENS:8192}

# ??? Tavily ???????????????????????????????????????????????
tavily.api-key=${TAVILY_API_KEY}
tavily.base-url=${TAVILY_BASE_URL:https://api.tavily.com}
tavily.max-results=${TAVILY_MAX_RESULTS:5}
tavily.include-answer=${TAVILY_INCLUDE_ANSWER:true}
tavily.include-raw-content=${TAVILY_INCLUDE_RAW_CONTENT:false}

# ??? Scraper ??????????????????????????????????????????????
scraper.base-url=${SCRAPER_BASE_URL:http://localhost:8080}
scraper.poll-interval-ms=${SCRAPER_POLL_INTERVAL_MS:20000}
scraper.default-depth=${SCRAPER_DEFAULT_DEPTH:5}

# ??? LangGraph4j ??????????????????????????????????????????
langgraph4j.postgres.host=${LANGGRAPH4J_DB_HOST:localhost}
langgraph4j.postgres.port=${LANGGRAPH4J_DB_PORT:5432}
langgraph4j.postgres.database=${LANGGRAPH4J_DB_DATABASE}
langgraph4j.postgres.username=${LANGGRAPH4J_DB_USERNAME}
langgraph4j.postgres.password=${LANGGRAPH4J_DB_PASSWORD}

# ??? Agent ????????????????????????????????????????????????
agent.scoring.min-review-count=${AGENT_MIN_REVIEW_COUNT:200}
agent.scoring.min-rating=${AGENT_MIN_RATING:4.0}
agent.scoring.tier1-review-count=${AGENT_TIER1_REVIEW_COUNT:500}
agent.scoring.tier1-min-rating=${AGENT_TIER1_MIN_RATING:4.0}
agent.scoring.tier2-review-count=${AGENT_TIER2_REVIEW_COUNT:200}
agent.scoring.tier2-min-rating=${AGENT_TIER2_MIN_RATING:3.8}

# ??? Logging ??????????????????????????????????????????????
logging.level.com.business.discovery=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{runId}] %logger{36} - %msg%n

# ??? Docker ???????????????????????????????????????????????
docker.host=${DOCKER_HOST:unix:///var/run/docker.sock}
docker.worker.image=${DOCKER_WORKER_IMAGE:discovery-worker:latest}
docker.pool.max-size=${MAX_POOL_SIZE:2}
docker.container.max-lifetime-minutes=${MAX_CONTAINER_LIFETIME_MINUTES:30}
docker.network.name=${DOCKER_NETWORK_NAME:shared-network}
# Docker endpoint spawned workers use for smoke-test builds/publish (worker docker CLI)
app.docker.worker-docker-host=${WORKER_DOCKER_HOST:tcp://docker-proxy:2375}
app.worker.smoke-enabled=${WORKER_SMOKE_ENABLED:true}
app.worker.smoke-flows-strict=${WORKER_SMOKE_FLOWS_STRICT:false}

# Demo instances (Phase 4) — GHCR image pull + run; GITHUB_TOKEN needs read:packages
# (worker publish additionally needs write:packages)
app.demo.port-range=${DEMO_PORT_RANGE:9000-9019}
app.demo.public-host=${DEMO_PUBLIC_HOST:localhost}
app.demo.max-lifetime-hours=${DEMO_MAX_LIFETIME_HOURS:48}
app.demo.boot-timeout-seconds=${DEMO_BOOT_TIMEOUT_SECONDS:90}

# ??? Scraper container ????????????????????????????????????????????
scraper.container.name=${SCRAPER_CONTAINER_NAME:scraper}
# Pinned (NOT :latest) — gosom before v1.16.2 404s while downloading the Playwright driver from the
# retired azureedge CDN (issue #302). :latest also never re-pulls once cached locally
# (ScraperContainerService.pullImageIfAbsent). Bump this tag deliberately when upgrading gosom.
scraper.container.image=${SCRAPER_CONTAINER_IMAGE:gosom/google-maps-scraper:v1.17.1}

# Worker config — passed through to spawned worker containers as env vars
worker.llm.anthropic.api-key=${ANTHROPIC_API_KEY:}
worker.llm.gemini.pro-model=${GEMINI_PRO_MODEL:gemini-2.5-pro}
worker.llm.gemini.flash-model=${GEMINI_FLASH_MODEL:gemini-2.5-flash}
worker.llm.gemini.pro-thinking-budget=${GEMINI_PRO_THINKING_BUDGET:16384}
worker.llm.gemini.flash-thinking-budget=${GEMINI_FLASH_THINKING_BUDGET:0}
worker.github.owner=${GITHUB_OWNER:}
worker.github.token=${GITHUB_TOKEN:}

# ??? Cline integration (chat + LLM proxy) ????????????????????????????
# Cline's LLM calls route through this app's OpenAI-compatible proxy — Cline never holds the Gemini key.
# The sidecar authenticates to the proxy with this shared internal token.
cline.enabled=${CLINE_ENABLED:true}
cline.sidecar.base-url=${CLINE_SIDECAR_URL:http://cline-sidecar:8091}
cline.context.max-messages=${CLINE_CONTEXT_MAX_MESSAGES:5}
cline.proxy.internal-token=${CLINE_INTERNAL_TOKEN:}
# Gemini NATIVE API host root — Cline's gemini provider speaks native (no OpenAI shim → tool-calling works).
cline.proxy.gemini-base-url=${CLINE_PROXY_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
cline.proxy.gemini-model=${CLINE_PROXY_GEMINI_MODEL:gemini-2.5-pro}
# MCP grant signing (Layer 2 auth) — short-lived, brief-pinned, user-scoped tokens for MCP tool calls.
cline.mcp.grant-secret=${CLINE_MCP_GRANT_SECRET:}
cline.mcp.grant-ttl-seconds=${CLINE_MCP_GRANT_TTL_SECONDS:300}
# Branch Cline's repo edits commit to; PR'd into the default branch, never committed directly.
cline.repo.working-branch=${CLINE_REPO_BRANCH:cline/edits}
# Cline execution sandbox — long-lived per-brief container the master drives via `docker exec`.
sandbox.image=${SANDBOX_IMAGE:discovery-sandbox:latest}
# Dedicated network for sandbox containers — isolated from shared-network (no docker-proxy / postgres /
# app), internet egress only. The master reaches the sandbox via `docker exec`, not over this network.
sandbox.network.name=${SANDBOX_NETWORK_NAME:sandbox-network}
sandbox.workspace-dir=${SANDBOX_WORKSPACE_DIR:/workspace}
sandbox.idle-timeout-minutes=${SANDBOX_IDLE_TIMEOUT_MINUTES:30}
sandbox.max-instances=${SANDBOX_MAX_INSTANCES:2}
sandbox.exec-timeout-seconds=${SANDBOX_EXEC_TIMEOUT_SECONDS:600}
sandbox.output-max-bytes=${SANDBOX_OUTPUT_MAX_BYTES:100000}
# Semantic (vector) chat memory for the Cline project chat — pgvector + in-process all-MiniLM embeddings.
cline.memory.semantic.enabled=${CLINE_SEMANTIC_MEMORY_ENABLED:true}
cline.memory.semantic.top-k=${CLINE_SEMANTIC_TOP_K:3}
cline.memory.semantic.min-score=${CLINE_SEMANTIC_MIN_SCORE:0.6}

# ??? Ops Console auth — default operator seed (Access & Roles) ????????
# OperatorSeeder creates this operator on startup if OPS_ADMIN_EMAIL has no user yet,
# so you can always log in. Set OPS_ADMIN_FORCE_RESET=true (then restart) to break-glass
# reset the operator's password to OPS_ADMIN_PASSWORD; flip back to false afterwards.
ops.admin.email=${OPS_ADMIN_EMAIL:}
ops.admin.password=${OPS_ADMIN_PASSWORD:}
ops.admin.name=${OPS_ADMIN_NAME:Operator}
ops.admin.force-reset=${OPS_ADMIN_FORCE_RESET:false}