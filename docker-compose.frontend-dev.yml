services:
  frontend:
    image: node:20-alpine
    container_name: discovery-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_BASE_URL=http://app:${SERVER_PORT:-8090}
    depends_on:
      - app
    networks:
      - shared-network
